<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4f5ef">
<meta name="description" content="甜水园食堂 · 每周家宴点菜">
<title>甜水园食堂</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316180f'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff2442'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"JetBrains Mono";font-weight:500;font-display:swap;src:url(vendor/jetbrains-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:700;font-display:swap;src:url(vendor/jetbrains-mono-latin-700-normal.woff2) format("woff2")}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: phone-first single column. Poster-style issue header (black pill + heavy date), info strip, 2-up dish cards, floating cart; 往期 is a photo journal. Quiet sage neutrals, one red accent, mono for numbers. */
:root{
  --bg:#f4f5ef; --paper:#ffffff; --ink:#16180f; --muted:#6a6e61; --line:#e2e4da; --chip:#eceee6;
  --accent:#ff2442; --accent-ink:#ffffff; --accent-soft:#ffe8eb; --green:#2c4a22; --green-soft:#e4e9da;
  --shadow:0 18px 50px -18px rgba(30,40,20,.35);
  --t1:#e4e9da; --t2:#efe7da; --t3:#e3e6ee; --t4:#dce6e4; --t5:#f2e4e1; --tink:#4a5040;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11130e; --paper:#1a1d16; --ink:#eef0e7; --muted:#9a9f90; --line:#2b2f25; --chip:#23271e;
  --accent:#ff4d66; --accent-ink:#ffffff; --accent-soft:#3a1d22; --green:#d3eb9c; --green-soft:#232820;
  --shadow:0 18px 50px -18px rgba(0,0,0,.7);
  --t1:#262b21; --t2:#2c2820; --t3:#24262d; --t4:#212a28; --t5:#2d2322; --tink:#b9bfae; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11130e; --paper:#1a1d16; --ink:#eef0e7; --muted:#9a9f90; --line:#2b2f25; --chip:#23271e;
  --accent:#ff4d66; --accent-ink:#ffffff; --accent-soft:#3a1d22; --green:#d3eb9c; --green-soft:#232820;
  --shadow:0 18px 50px -18px rgba(0,0,0,.7);
  --t1:#262b21; --t2:#2c2820; --t3:#24262d; --t4:#212a28; --t5:#2d2322; --tink:#b9bfae; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 190px}
button,input,textarea,select{font:inherit;color:inherit}
/* iOS（含微信）输入框字号小于 16px 会在聚焦时自动放大 */
input,textarea,select{font-size:16px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{width:9px;height:9px;border-radius:50%;background:var(--accent);flex-shrink:0}
.brand b{font-size:18px;font-weight:900;letter-spacing:.02em;white-space:nowrap}
.seg{display:inline-flex;gap:6px;flex-shrink:0}
.seg button{border:1px solid var(--line);background:var(--paper);padding:5px 12px;border-radius:999px;font-size:13px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.banner{font-size:12.5px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px;color:var(--muted)}
.banner b{color:var(--accent);font-weight:700}

/* friend top switch */
.switch{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.switch button{border:0;background:none;padding:8px 0 10px;font-weight:700;color:var(--muted);font-size:15px;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.switch button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.switch .ct{font-family:var(--f-mono);font-size:12px;color:var(--accent);margin-left:4px}

/* issue header */
.cover{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.eyebrow .pill{background:var(--ink);color:var(--bg);padding:3px 10px;border-radius:999px;letter-spacing:.08em;font-weight:500}
.eyebrow .closed{background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:999px;font-weight:500}
.cover h1{font-weight:900;font-size:40px;line-height:1.08;letter-spacing:-.01em}
.cover h1 em{font-style:normal;font-family:var(--f-mono);font-weight:700;color:var(--accent);letter-spacing:-.04em;margin-right:6px}
.cover .lede{margin:0;color:var(--muted);font-size:14.5px}
.strip{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-top:4px}
.strip > div{padding:10px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.strip > div + div{border-left:1px solid var(--line)}
.strip b{font-family:var(--f-mono);font-size:20px;font-weight:700;line-height:1.2}
.strip span{font-size:12px;color:var(--muted)}
.strip .who{flex-direction:row;align-items:center;gap:8px}
.faces{display:flex;flex-shrink:0}
.face{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;border:2px solid var(--paper);margin-left:-7px;flex-shrink:0}
.faces .face:first-child{margin-left:0}

.hello{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 16px;margin:14px 0 2px}
.hello label{font-weight:700;white-space:nowrap}
.hello input{flex:1;min-width:0;border:0;background:var(--chip);border-radius:10px;padding:8px 12px;outline:none}

/* category chips */
.cats{position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:15;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats a{flex-shrink:0;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:500}
.cats a:active{background:var(--ink);color:var(--bg)}
.cat{font-size:13px;color:var(--muted);letter-spacing:.08em;font-weight:500;margin:14px 0 10px;scroll-margin-top:110px;display:flex;align-items:center;gap:8px}
.cat::after{content:"";flex:1;height:1px;background:var(--line)}
.cat small{font-family:var(--f-mono);font-size:11px}

/* dish grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dish{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.dish.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pic{position:relative;aspect-ratio:4/3;max-width:100%}
.pic img,.pic .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{display:grid;place-items:center;font-size:34px;font-weight:900;color:var(--tink);opacity:.9}
.badge{position:absolute;z-index:1;left:8px;top:8px;background:var(--paper);color:var(--accent);font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;font-family:var(--f-body)}
.dish .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.dish h3{font-size:15px;font-weight:700}
.dish p{margin:0;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.dish .foot{margin-top:auto;padding-top:8px;display:flex;justify-content:flex-end}
.step{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:999px;padding:2px}
.step.solo{background:none;padding:0}
.step button{width:28px;height:28px;border-radius:50%;border:0;display:grid;place-items:center;font-size:18px;line-height:1;font-weight:500}
.step .plus{background:var(--accent);color:var(--accent-ink)}
.step .minus{background:var(--paper);color:var(--ink)}
.step span{min-width:12px;text-align:center;font-weight:700;font-family:var(--f-mono);font-size:13px}

/* wish card */
.wish{margin-top:22px;background:var(--paper);border:1px dashed var(--muted);border-radius:var(--r);padding:16px}
.wish h2{font-size:17px;font-weight:700}
.wish .hint{font-size:13px;color:var(--muted);margin:2px 0 6px}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin:10px 0}
input[type=date].input,input[type=time].input{-webkit-appearance:none;appearance:none;min-height:44px}
.field label{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.input,textarea.input,select.input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;outline:none}
.input:focus{border-color:var(--ink)}
textarea.input{resize:vertical;min-height:64px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tagx{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 5px 4px 12px;font-size:13px;max-width:100%;font-weight:500}
.tagx span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagx button{border:0;background:var(--paper);color:var(--ink);border-radius:50%;width:20px;height:20px;line-height:1}

.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.danger{background:var(--accent-soft);color:var(--accent)}
.btn.small{padding:6px 13px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* floating cart */
/* 底部右下角有 Netlify 免费版强制的标志（约 60px 高），浮条和弹窗都要让开 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.bar .in{pointer-events:auto;max-width:528px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 7px 7px 8px;box-shadow:var(--shadow)}
.bowl{min-width:38px;height:38px;border-radius:999px;background:var(--bg);color:var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:16px;flex-shrink:0;padding:0 8px}
.bar .sum{display:flex;align-items:center;gap:10px;min-width:0;font-size:13.5px}
.bar .sum span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .btn{padding:10px 20px}

/* history journal */
.entry{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px}
.collage{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:3/2;max-width:100%}
.collage img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;min-height:0}
.collage img:first-child{grid-row:1/3}
.collage.n1{grid-template-columns:1fr;grid-template-rows:1fr}
.collage.n2{grid-template-rows:1fr}
.collage.n2 img:first-child{grid-row:auto}
.nophoto{aspect-ratio:3/1;display:grid;place-items:center;color:var(--muted);font-size:13px;background:var(--chip);max-width:100%}
.entry .body{padding:14px 16px 16px}
.stamp{display:flex;align-items:baseline;gap:8px}
.stamp b{font-family:var(--f-mono);font-size:22px;font-weight:700;letter-spacing:-.03em}
.stamp span{font-size:12.5px;color:var(--muted)}
.dishes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dishes span{border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:13px}
.guests{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--muted)}

/* host */
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 0 10px;color:var(--muted);font-weight:700;font-size:15px;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card h2{font-size:22px;font-weight:900}
.card h2 .mono{color:var(--accent);letter-spacing:-.03em}
.card h3{font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:.1em;margin-bottom:6px}
.stat{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:3px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.stat:first-of-type{border-top:0}
.rank{font-family:var(--f-mono);font-weight:700;color:var(--muted);font-size:13px}
.stat:nth-of-type(1) .rank{color:var(--accent)}
.stat .count{font-family:var(--f-mono);font-weight:700;font-size:15px}
.stat .names{grid-column:2/-1;font-size:12.5px;color:var(--muted)}
.meter{grid-column:2/-1;height:4px;background:var(--chip);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);border-radius:2px}
.stat:nth-of-type(1) .meter i{background:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:12px 0 4px;background:var(--bg);border-radius:14px}
.kpis div{padding:10px 12px}
.kpis div + div{border-left:1px solid var(--line)}
.kpis b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:700;line-height:1.2}
.kpis span{font-size:12px;color:var(--muted)}
.pills{min-width:0;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pill{flex-shrink:0;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.pill[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted);font-weight:500;vertical-align:2px}
.tag.open{background:var(--green-soft);color:var(--green)}
.tag.done{background:var(--accent-soft);color:var(--accent)}
.share{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:999px;padding:6px 6px 6px 14px;margin-top:12px}
.share code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-family:var(--f-mono);color:var(--muted)}
.ticket{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;font-size:13.5px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px}
.ticket:first-of-type{border-top:0;margin-top:0;padding-top:0}
.ticket .face{grid-row:1/3;margin:0}
.ticket .p{display:flex;justify-content:space-between;gap:8px}
.libitem{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.libitem:first-child{border-top:0}
.libitem .pic{width:56px;aspect-ratio:1;border-radius:12px;overflow:hidden}
.libitem .ph{font-size:20px}
.libitem.off{opacity:.5}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;max-width:100%}
.upload{display:grid;place-items:center;aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px;cursor:pointer;text-align:center}
.empty{text-align:center;color:var(--muted);padding:44px 12px}
.empty h2{color:var(--ink);font-size:20px;font-weight:900;margin-bottom:6px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,8,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
/* 弹窗 = 可滚动的内容 + 固定在底部的按钮栏；按钮栏下面留出 Netlify 标志的位置，滚到哪儿按钮都不会被挡 */
.sheet{position:relative;background:var(--paper);width:100%;max-width:560px;max-height:90%;display:flex;flex-direction:column;overflow:hidden;border-radius:20px 20px 0 0}
.sbody{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-top:22px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet.hasfoot .sbody{padding-bottom:14px}
.sfoot{flex-shrink:0;border-top:1px solid var(--line);background:var(--paper);padding-top:10px;padding-bottom:calc(74px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sfoot > *{margin-top:0 !important}
.sheet::before{content:"";position:absolute;left:50%;top:8px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
.sheet h2{font-size:22px;font-weight:900;margin-bottom:4px}
.check{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.imgpick{display:flex;gap:12px;align-items:center}
.imgpick .pic{width:92px;aspect-ratio:1;border-radius:14px;overflow:hidden}
.toast{position:fixed;left:50%;bottom:calc(176px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.ailabel{position:absolute;right:6px;bottom:6px;z-index:1;font-size:10px;line-height:16px;padding:0 6px;border-radius:6px;background:rgba(0,0,0,.45);color:#fff}
.footlinks{display:flex;justify-content:center;gap:16px;margin-top:28px}
.linkish{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;padding:6px}
/* 裁剪 */
.crop{position:fixed;inset:0;z-index:80;background:#0d0e0b;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.crop .ctop{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.crop .ctop b{font-size:16px}
.crop .stage{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.crop .stage canvas{position:absolute;left:50%;top:50%;max-width:none;pointer-events:none}
.crop .frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:6px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55);pointer-events:none}

const pick = (arr, s) => arr[parseInt(hash(s || "?"), 36) % arr.length];
// 没上传照片的菜，用主人登录时按菜名自动找到的网上照片（存进数据库，朋友看到的是同一张）
// 照片以 dataURL 存在表里，每次重绘都塞进 HTML 会让手机卡住（点击排队、过一会儿一起触发）。
// 转成 blob 地址只做一次，之后重绘只是短链接，浏览器也能复用解码好的图。
const blobURLs = new Map();
function dataURLtoBlob(u){
  const k = u.indexOf(","), bin = atob(u.slice(k + 1)), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: u.slice(5, k).split(";")[0] || "image/jpeg" });
}
// 照片存在 Supabase Storage 里，表里只记 "sb:路径"；老数据里的 dataURL 也还能显示
const storageURL = path => CFG.url + "/storage/v1/object/public/img/" + path;
function imgSrc(u){
  if (!u) return u;
  if (u.startsWith("sb:")) return storageURL(u.slice(3));
  if (!u.startsWith("data:")) return u;
  let b = blobURLs.get(u);
  if (!b) {
    try { b = URL.createObjectURL(dataURLtoBlob(u)); } catch(e){ b = u; }
    blobURLs.set(u, b);
  }
  return b;
}

}

// 裁剪/缩放：拖动移动、双指或滑杆缩放、可旋转；返回 JPEG dataURL，取消返回 null
function loadImage(src){
  return new Promise((res, rej) => { const img = new Image(); img.crossOrigin = "anonymous"; img.onload = () => res(img); img.onerror = () => rej(new Error("图片读不出来")); img.src = src; });
}
async function cropImage(source, { aspects = [4/3], out = 960, q = 0.78 } = {}){
  const url = typeof source === "string" ? imgSrc(source) : URL.createObjectURL(source);
  let img; try { img = await loadImage(url); } finally { if (typeof source !== "string") URL.revokeObjectURL(url); }
  const names = { [4/3]: "4:3", 1: "1:1", [3/4]: "3:4" };
  const root = document.createElement("div"); root.className = "crop";
  root.innerHTML = `<div class="ctop"><button type="button" class="btn ghost small" data-c="cancel">取消</button><b>调整照片</b><button type="button" class="btn small" data-c="ok">用这张</button></div>
    <div class="stage"><canvas></canvas><div class="frame"></div></div>
    <div class="tools"><input type="range" min="1" max="4" step="0.01" value="1" aria-label="缩放">
      <div class="row" style="justify-content:center">${aspects.length > 1 ? aspects.map((a,i) => `<button type="button" class="btn ghost small" data-a="${i}">${names[a] || "原比例"}</button>`).join("") : ""}<button type="button" class="btn ghost small" data-c="rot">旋转 90°</button></div>
      <div class="hint">拖动调整位置，双指或滑杆缩放</div></div>`;
  document.body.appendChild(root);
  const stage = root.querySelector(".stage"), cv = root.querySelector("canvas"), frame = root.querySelector(".frame"), zoom = root.querySelector("input");
  let src, rot = 0, aspect = aspects[0], W, H, s0, z = 1, tx = 0, ty = 0;
  const draw = () => {   // 先把旋转后的图画进一张源画布（最长边 2048 以内）
    const k = Math.min(1, 2048 / Math.max(img.width, img.height)), w = Math.round(img.width*k), h = Math.round(img.height*k);
    src = document.createElement("canvas"); const sw = rot % 180 ? h : w, sh = rot % 180 ? w : h;
    src.width = sw; src.height = sh; const g = src.getContext("2d");
    g.translate(sw/2, sh/2); g.rotate(rot * Math.PI/180); g.drawImage(img, -w/2, -h/2, w, h);
    cv.width = sw; cv.height = sh; cv.getContext("2d").drawImage(src, 0, 0);
  };
  const layout = () => {
    const r = stage.getBoundingClientRect(), a = aspect || src.width / src.height;
    W = Math.min(r.width - 32, (r.height - 32) * a, 560); H = W / a;
    frame.style.width = W + "px"; frame.style.height = H + "px";
    s0 = Math.max(W / src.width, H / src.height); apply();
  };
  const apply = () => {
    const s = s0 * z, mx = Math.max(0, (src.width*s - W)/2), my = Math.max(0, (src.height*s - H)/2);
    tx = Math.max(-mx, Math.min(mx, tx)); ty = Math.max(-my, Math.min(my, ty));
    cv.style.width = src.width*s + "px"; cv.style.height = src.height*s + "px";
    cv.style.transform = `translate(-50%,-50%) translate(${tx}px,${ty}px)`; zoom.value = z;
  };
  const setZoom = nz => { nz = Math.max(1, Math.min(4, nz)); tx *= nz / z; ty *= nz / z; z = nz; apply(); };
  const pts = new Map(); let pinch = null;
  stage.addEventListener("pointerdown", e => { stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); pinch = null; });
  stage.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return; const [px, py] = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 1) { tx += e.clientX - px; ty += e.clientY - py; apply(); }
    else { const [a, b] = [...pts.values()], d = Math.hypot(a[0]-b[0], a[1]-b[1]); if (pinch) setZoom(z * d / pinch); pinch = d; }
  });
  const up = e => { pts.delete(e.pointerId); pinch = null; };
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
  stage.addEventListener("wheel", e => { e.preventDefault(); setZoom(z * (e.deltaY < 0 ? 1.08 : 1/1.08)); }, { passive: false });
  zoom.oninput = () => setZoom(+zoom.value);
  const pressA = () => root.querySelectorAll("[data-a]").forEach(b => b.setAttribute("aria-pressed", String(aspects[+b.dataset.a] === aspect)));
  draw(); layout(); pressA();
  const onResize = () => layout(); window.addEventListener("resize", onResize);
  return new Promise(res => {
    root.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.a) { aspect = aspects[+b.dataset.a]; pressA(); z = 1; tx = ty = 0; layout(); return; }
      const c = b.dataset.c;
      if (c === "rot") { rot = (rot + 90) % 360; z = 1; tx = ty = 0; draw(); layout(); return; }
      let result = null;
      if (c === "ok") {
        const s = s0 * z, sw = W / s, sh = H / s, sx = src.width/2 - (W/2 + tx)/s, sy = src.height/2 - (H/2 + ty)/s;
        const k = Math.min(1, out / Math.max(sw, sh) * Math.max(1, 1)), o = document.createElement("canvas");
        o.width = Math.round(Math.min(out, sw >= sh ? out : out * sw / sh)); o.height = Math.round(o.width * sh / sw);
        o.getContext("2d").drawImage(src, sx, sy, sw, sh, 0, 0, o.width, o.height);
        result = o.toDataURL("image/jpeg", q);
      }
      window.removeEventListener("resize", onResize); root.remove(); res(result);
    });
  });
}
function fileToDataURL(file, max=720, q=0.72){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("图片读不出来")); };
    img.src = url;
  });
}

const Local = {
  data: null, subs: {}, warned: false,
  load(){ try { this.data = JSON.parse(ls.get(LOCAL_KEY)); } catch(e){} if (!this.data) this.data = demoSeed(); },
  persist(){ if (!ls.set(LOCAL_KEY, JSON.stringify(this.data)) && !this.warned) { this.warned = true; toast("这个浏览器存不了数据，刷新后改动会消失"); } },
  list(col){ return Object.entries(this.data[col] || {}).map(([id, v]) => ({ id, ...v })); },
  watch(col, cb){ (this.subs[col] ||= []).push(cb); cb(this.list(col)); return () => { this.subs[col] = this.subs[col].filter(f => f !== cb); }; },
  emit(col){ (this.subs[col] || []).forEach(f => f(this.list(col))); },
  async set(col, id, v){ (this.data[col] ||= {})[id] = v; this.persist(); this.emit(col); },
  async remove(col, id){ if (this.data[col]) delete this.data[col][id]; this.persist(); this.emit(col); },
};
// 云端：一张 docs 表（col + id + data），增量拉取 + 实时推送，删除用软删除
const Cloud = {
  sb: null, cache: {}, subs: {}, last: null,
  list(col){ return [...(this.cache[col] || new Map()).values()]; },
  watch(col, cb){ (this.subs[col] ||= []).push(cb); cb(this.list(col)); return () => { this.subs[col] = this.subs[col].filter(f => f !== cb); }; },
  emit(col){ (this.subs[col] || []).forEach(f => f(this.list(col))); },
  apply(rows){
    const touched = new Set();
    for (const r of rows || []) {
      const m = (this.cache[r.col] ||= new Map());
      if (!r.data || r.data._deleted) m.delete(r.id); else m.set(r.id, { ...r.data, id: r.id });
      touched.add(r.col);
      if (r.updated_at && (!this.last || r.updated_at > this.last)) this.last = r.updated_at;
    }
    touched.forEach(c => this.emit(c));
  },
  // 照片存在行里，一次全拉会有好几 MB，手机网络/微信里容易断。改成每次 15 行分批拉，
  // 每批 20 秒超时、失败重试两次；拉到哪算哪，下次从断点继续。
  async pull(){
    const PAGE = 15;
    for (;;) {
      let data, err;
      for (let tries = 0; tries < 3; tries++) {
        const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 20000);
        let q = this.sb.from("docs").select("col,id,data,updated_at").order("updated_at", { ascending: true }).limit(PAGE).abortSignal(ac.signal);
        if (this.last) q = q.gt("updated_at", this.last);
        try { const r = await q; data = r.data; err = r.error; } catch(e){ err = e; }

  async offload(col, id, body){

  remove(col, id){ return this.set(col, id, { _deleted: true }); },
};
const backend = () => S.mode === "cloud" ? Cloud : Local;

function startLocal(){
  if (S.mode !== "loading") return;

}
function setOwner(on){
  S.isOwner = on;

}
async function startCloud(){
  const sb = Cloud.sb = window.supabase.createClient(CFG.url, CFG.key);
  const { data } = await sb.auth.getSession();
  S.mode = "cloud"; S.canWrite = true;
  setOwner(!!(data && data.session));
  sb.auth.onAuthStateChange((_e, session) => { if (!!session !== S.isOwner) { setOwner(!!session); render(); } });
  try { await Cloud.pull(); } catch(e){ S.loadError = (e && (e.message || e.code)) || String(e); }
  subscribeAll();
  if (CFG.realtime !== false) sb.channel("docs").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, p => { if (p.new && p.new.col) Cloud.apply([p.new]); }).subscribe();
  const refresh = () => Cloud.pull().then(() => { if (S.loadError) { S.loadError = false; render(); } }).catch(() => {});
  setInterval(refresh, CFG.realtime === false ? 15000 : 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  if (S.isOwner) backfillPhotos();
}
async function boot(){
  if (CFG.url && CFG.key && window.supabase) { try { await startCloud(); return; } catch(e){ S.mode = "loading"; } }
  startLocal();
}

/* ---------- 参考图：按菜名在中文维基百科找配图，主人这边下载一次存进数据库 ---------- */
async function findPhoto(name, skip = 0){
  const api = "https://zh.wikipedia.org/w/api.php?origin=*&format=json&formatversion=2&action=query&redirects=1"
    + "&prop=pageimages&piprop=thumbnail&pithumbsize=720&generator=search&gsrlimit=10&gsrsearch=" + encodeURIComponent(name);
  const j = await (await fetch(api)).json();
  const pages = ((j.query && j.query.pages) || []).filter(p => p.thumbnail && !/\.(svg|png)/i.test(p.thumbnail.source)).sort((a,b) => a.index - b.index);
  if (!pages.length) return null;
  const p = pages[skip % pages.length];
  const r = await fetch(p.thumbnail.source);
  if (!r.ok) return null;
  return { stockImg: await fileToDataURL(await r.blob(), 720, 0.78), stockFrom: p.title, stockSkip: skip };
}
async function makePhoto(id){
  let d = dishById(id); if (!d || d.img || d.stockImg) return;
  let found = null;
  try { found = await findPhoto(d.name, d.stockSkip || 0); } catch(e){ return; }
  d = dishById(id);
  if (found && d && !d.img) await save("dishes", id, { ...d, ...found });
}
let backfilling = false;
async function backfillPhotos(){
  if (backfilling || S.mode !== "cloud") return; backfilling = true;
  for (const d of S.dishes.filter(x => !x.img && !x.stockImg && !x.stockNone)) await makePhoto(d.id);
  backfilling = false;
}

/* ---------- derived ---------- */
const menuById = id => S.menus.find(m => m.id === id);
const sortedMenus = () => [...S.menus].sort((a,b) => (b.date||"").localeCompare(a.date||""));
const doneMenus = () => sortedMenus().filter(m => m.status === "done");
const dishById = id => S.dishes.find(d => d.id === id);
const ordersFor = id => S.orders.filter(o => o.menuId === id).sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
const photosFor = id => S.photos.filter(p => p.menuId === id).sort((a,b) => (a.createdAt||0)-(b.createdAt||0));
function tally(menuId){
  const map = new Map(), customs = [];
  for (const o of ordersFor(menuId)) {
    for (const it of o.items || []) {
      const k = it.dishId || it.name;
      const e = map.get(k) || { name: (dishById(it.dishId) || it).name, dishId: it.dishId, qty: 0, people: [] };
      e.qty += it.qty || 1; e.people.push(o.name + ((it.qty||1) > 1 ? `×${it.qty}` : "")); map.set(k, e);
    }
    for (const c of o.customs || []) customs.push({ ...c, by: o.name });
  }
  return { dishes: [...map.values()].sort((a,b) => b.people.length - a.people.length || b.qty - a.qty), customs };
}
function issueNo(menu){ const asc = [...S.menus].sort((a,b) => (a.date||"").localeCompare(b.date||"")); return asc.indexOf(menu) + 1; }

/* ---------- 约饭 ----------
   每个周末一拨朋友包场。周六默认开放、周日默认不开，主人在“档期”里逐天开关（slots 里存例外）。
   朋友提交预约（bookings，status: pending → confirmed / declined，或自己 cancelled），
   某天有待确认或已确认的预约、或者主人已经开了那天的菜单，就显示“已被约”。 */
const LIVE = ["pending", "confirmed"];
function weekendDates(weeks = 8){
  const out = [], t = new Date(); t.setHours(12,0,0,0);
  for (let i = 1; i <= weeks * 7; i++) { const d = new Date(t); d.setDate(t.getDate() + i); if (d.getDay() === 6 || d.getDay() === 0) out.push(d.toISOString().slice(0,10)); }
  return out;
}
const slotId = date => "s" + date.replace(/-/g, "");
function slotOpen(date){ const s = S.slots.find(x => x.id === slotId(date)); return s ? !!s.open : dt(date).getDay() === 6; }
const bookingsOn = date => S.bookings.filter(b => b.date === date && LIVE.includes(b.status)).sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
const menuOn = date => S.menus.find(m => m.date === date);
const pendingBookings = () => S.bookings.filter(b => b.status === "pending" && daysTo(b.date) >= 0);
function myBookingIds(){ try { return JSON.parse(ls.get("tsy-bookings") || "[]"); } catch(e){ return []; } }
const myBookings = () => { const ids = myBookingIds(); return S.bookings.filter(b => ids.includes(b.id) && daysTo(b.date) >= 0 && b.status !== "cancelled").sort((a,b) => a.date.localeCompare(b.date)); };
const BK_STATUS = { pending: "等主人确认", confirmed: "主人确认啦", declined: "主人这天没空" };

function bookHTML(){
  const mine = myBookings(), mineIds = new Set(mine.map(b => b.id));
  let html = mine.map(b => `<section class="card mybk"><div class="spread"><div class="stamp"><b>${mmdd(b.date)}</b><span>${weekday(b.date)} · ${b.people || 1} 人</span></div><span class="tag ${b.status === "confirmed" ? "open" : ""}">${BK_STATUS[b.status] || ""}</span></div>
      ${b.note ? `<p class="muted" style="margin:6px 0 0;font-size:13.5px">${esc(b.note)}</p>` : ""}
      <div class="row end" style="margin-top:10px">${b.status !== "declined" ? `<button type="button" class="btn ghost small" data-act="cancelBooking" data-id="${b.id}">取消预约</button>` : ""}${b.menuId && menuById(b.menuId) ? `<a class="btn small" href="#${b.menuId}" style="text-decoration:none">去点菜</a>` : ""}</div></section>`).join("");
  html += `<section class="card"><h2 style="font-size:18px;font-weight:900">挑个周末来吃饭</h2><p class="muted" style="margin:2px 0 8px;font-size:13px">一个周末只约一拨朋友，主人确认后就定了。</p>`;
  for (const date of weekendDates()) {
    const open = slotOpen(date), bs = bookingsOn(date), menu = menuOn(date), isSun = dt(date).getDay() === 0;
    if (isSun && !open && !bs.length && !menu) continue;
    const minee = bs.find(b => mineIds.has(b.id));
    let status, btn = "";
    if (minee) status = `<b>你约的</b> · ${BK_STATUS[minee.status]}`;
    else if (bs.length) status = `已被 <b>${esc(bs[0].name)}</b> 约了`;
    else if (menu) status = `已经安排了`;
    else if (!open) status = `主人没空`;
    else { status = `<b>可以约</b>`; btn = `<button type="button" class="btn small" data-act="book" data-date="${date}">约这天</button>`; }
    html += `<div class="slot ${!open || bs.length || menu ? "off" : ""}"><div class="d"><b>${mmdd(date)}</b><span>${weekday(date)}${daysTo(date) <= 7 ? " · 这周" : ""}</span></div><div class="s">${status}</div>${btn}</div>`;
  }
  return html + `</section>`;
}
function bookSheet(date){

    <div class="field"><label for="bname">你的昵称</label><input class="input" id="bname" maxlength="20" value="${esc(S.friendName || ls.get("tsy-name") || "")}" placeholder="主人靠它认出你"></div>

function hostSlots(){
  let html = `<p class="muted" style="margin:0 0 10px;font-size:13px">周六默认开放，周日默认不开。点右边的按钮开关某一天；朋友在朋友页的“约饭”里预约。</p><section class="card">`;

// form: true 的弹窗点背景不会关（编辑时误触、收键盘都会点到背景），只能点“取消”
function openSheet(html, onMount, { form = false } = {}){
  quiet(400);
  $("#sheetRoot").innerHTML = `<div class="scrim" data-act="closeSheet"${form ? " data-form" : ""}><div class="sheet" role="dialog" aria-modal="true"><div class="sbody">${html}</div></div></div>`;
  const sh = $("#sheetRoot .sheet"), body = sh.firstElementChild, last = body.lastElementChild;
  // 最后一排按钮挪到固定的底栏里
  if (last && last.querySelector("button")) { const f = document.createElement("div"); f.className = "sfoot"; f.appendChild(last); sh.appendChild(f); sh.classList.add("hasfoot"); }
  onMount && onMount(sh);
}
function closeSheet(){ $("#sheetRoot").innerHTML = ""; }
// 保存类按钮：点一下就锁住并显示“保存中…”，网慢时多点几下也只存一次
function lock(btn, fn, label = "保存中…"){
  btn.onclick = async e => {
    if (btn.dataset.busy) return;
    const t = btn.textContent; btn.dataset.busy = "1"; btn.disabled = true; btn.textContent = label;
    try { await fn(e); } finally { delete btn.dataset.busy; btn.disabled = false; if (btn.textContent === label) btn.textContent = t; }
  };
}
// iOS 微信里，弹窗刚打开、选完照片、从相册切回来时，常有一下“幽灵点击”落在保存/删除上
let quietUntil = 0;
const quiet = (ms = 600) => { quietUntil = Math.max(quietUntil, Date.now() + ms); };
document.addEventListener("click", e => {
  if (Date.now() < quietUntil && e.target.closest("#sheetRoot button, #sheetRoot .btn")) { e.stopImmediatePropagation(); e.preventDefault(); }
}, true);
document.addEventListener("change", e => { if (e.target.type === "file") quiet(); }, true);
document.addEventListener("visibilitychange", () => { if (!document.hidden) quiet(); });

// 删除按钮：第一下变成“再点一次确认删除”，隔一会儿再点才真删
function armDelete(btn, fn){
  let armed = 0;
  lock(btn, async () => {
    if (!armed) { armed = Date.now(); setTimeout(() => { btn.textContent = "再点一次确认删除"; }, 0); return; }
    if (Date.now() - armed < 700) return;
    await fn();
  }, "删除中…");
}

  if (S.hostMenuId === id) S.hostMenuId = null;
}

  openSheet(`<h2>补记一顿</h2><p class="muted" style="margin:0 0 6px">把以前的聚餐加进往期回顾。存好后可以接着传照片。</p>
    <div class="field"><label for="pdate">哪天吃的</label><input class="input" type="date" id="pdate" max="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label for="ptitle">备注（可不填）</label><input class="input" id="ptitle" maxlength="30" placeholder="比如：火锅局、小李生日"></div>
    <div class="field"><label for="pguests">谁来了（用顿号隔开，可不填）</label><input class="input" id="pguests" placeholder="比如：小王、阿杰、Lily"></div>
    <b>吃了哪些菜</b>
    ${lib.map(d => `<label class="check"><input type="checkbox" class="pdish" value="${d.id}"> ${esc(d.name)} <span class="tag">${esc(d.cat||"")}</span></label>`).join("") || `<p class="muted" style="margin:6px 0">菜单库里还没有菜，直接在下面写也行。</p>`}
    <div class="field" style="margin-top:10px"><label for="pextra">菜单库里没有的菜（用顿号隔开）</label><input class="input" id="pextra" placeholder="比如：拍黄瓜、可乐鸡翅"></div>
    <div class="row end"><button type="button" class="btn ghost" data-act="closeSheet">取消</button><button type="button" class="btn" id="psave">存好，去传照片</button></div>`,
  sh => {
    const split = v => v.split(/[、,，;；\s]+/).map(x => x.trim()).filter(Boolean);
    lock(sh.querySelector("#psave"), async () => {
      const date = sh.querySelector("#pdate").value;
      if (!date) { toast("选一下日期"); sh.querySelector("#pdate").focus(); return; }
      const picked = [...sh.querySelectorAll(".pdish:checked")].map(c => dishById(c.value)).filter(Boolean);
      const items = [...picked.map(d => ({ name: d.name, dishId: d.id })), ...split(sh.querySelector("#pextra").value).map(name => ({ name }))];
      if (!items.length) { toast("至少记一道菜"); return; }
      let mid = "m" + date.replace(/-/g, ""), n = 1;
      while (menuById(mid + (n > 1 ? "-" + n : ""))) n++;
      mid += n > 1 ? "-" + n : "";
      const rec = { date, time: "", title: sh.querySelector("#ptitle").value.trim(), note: "", dishIds: picked.map(d => d.id), status: "done",
        finalItems: items, guests: split(sh.querySelector("#pguests").value), past: true, createdAt: Date.now() };
      try { await save("menus", mid, rec); S.role = "friend"; S.friendTab = "history"; render(); allPhotosSheet(mid); toast("记好了，传几张照片吧"); }
      catch(e){ toast("没存上：" + (e.message || e.code)); }
    });
  }, { form: true });
}
function allPhotosSheet(id){
  const m = menuById(id);
  openSheet(`<h2>${mmdd(m.date)} 的成品</h2>${photoGrid(m)}<div class="row end" style="margin-top:14px"><button type="button" class="btn ghost" data-act="closeSheet">关闭</button></div>`);
}
function loginSheet(){
  openSheet(`<h2>主人登录</h2><p class="muted" style="margin:0">用你在 Supabase 里建的邮箱和密码。</p>
    <div class="field"><label for="lemail">邮箱</label><input class="input" id="lemail" type="email" autocomplete="username"></div>
    <div class="field"><label for="lpass">密码</label><input class="input" id="lpass" type="password" autocomplete="current-password"></div>
    <div><button type="button" class="btn" id="ldo" style="width:100%;padding-block:12px">登录</button>
    <div style="text-align:center;margin-top:2px"><button type="button" class="linkish" data-act="closeSheet">取消</button></div></div>`,
  sh => {
    sh.querySelector("#lpass").onkeydown = e => { if (e.key === "Enter") sh.querySelector("#ldo").click(); };
    lock(sh.querySelector("#ldo"), async () => {
      const { error } = await Cloud.sb.auth.signInWithPassword({ email: sh.querySelector("#lemail").value.trim(), password: sh.querySelector("#lpass").value });
      if (error) { toast("邮箱或密码不对"); return; }
      setOwner(true); S.role = "host"; closeSheet(); window.scrollTo(0,0); render(); toast("欢迎回来"); backfillPhotos();
    }, "登录中…");
  }, { form: true });
}
function photoSheet(pid){
  const p = S.photos.find(x => x.id === pid); if (!p) return;
  openSheet(`<img src="${esc(imgSrc(p.img))}" alt="成品照片" style="width:100%;border-radius:16px;display:block">
    <div class="row spread" style="margin-top:12px">${canManage() ? `<button type="button" class="btn danger small" id="pdel">删除这张</button>` : "<span></span>"}<button type="button" class="btn ghost" data-act="closeSheet">关闭</button></div>`,
  sh => { let armed = false; const b = sh.querySelector("#pdel"); if (b) b.onclick = async () => { if (!armed) { armed = true; b.textContent = "再点一次确认"; return; } await del("photos", pid); closeSheet(); }; });
}

/* ---------- actions ---------- */
async function submitOrder(){
  const m = currentFriendMenu(); if (!m) return;
  const name = S.friendName.trim();
  if (!name) { toast("先写上你的名字"); const f = $("#fname"); if (f) { f.scrollIntoView({ block: "center" }); f.focus(); } return; }
  const items = Object.entries(S.cart).filter(([,q]) => q > 0).map(([dishId, qty]) => ({ dishId, name: (dishById(dishId)||{}).name || "", qty }));
  if (!items.length && !S.customs.length) { toast("还没点菜"); return; }
  const prevId = ls.get("tsy-order-" + m.id);
  const oid = prevId || (m.id + "_" + hash(name));
  const old = S.orders.find(o => o.id === oid);
  const rec = { menuId: m.id, name, items, customs: S.customs, createdAt: old ? old.createdAt : Date.now(), updatedAt: Date.now() };
  const sb = $("[data-act=submit]"); if (sb) sb.textContent = "提交中…";
  try {
    await save("orders", oid, rec);
    ls.set("tsy-order-" + m.id, oid); ls.set("tsy-name", name);
    render();
    openSheet(`<h2>点好啦，${esc(name)}</h2><p class="muted">主人已经收到你的点单，${esc(fmtDate(m.date))}见。想改随时回来点“更新点单”。</p>
      <div class="card" style="box-shadow:none;background:var(--sunk);margin-top:10px">${items.map(it => `<div class="spread"><span>${esc(it.name)}</span><span class="num">×${it.qty}</span></div>`).join("")}
      ${S.customs.map(c => `<div class="spread"><span>许愿：${esc(c.name)}</span><span class="muted">${esc(c.taste||"")}</span></div>`).join("")}</div>
      <div class="row end"><button type="button" class="btn" data-act="closeSheet">好的</button></div>`);
  } catch(e){
    toast("没提交上，检查网络再试一次");
  }
}
async function uploadPhotos(menuId, files){
  let n = 0;
  for (const f of files) {
    try {
      // 一次只选一张时可以先裁剪；多张直接传
      let img;
      if (files.length === 1) { img = await cropImage(f, { aspects: [0, 4/3, 1, 3/4], out: 1280, q: 0.72 }); if (!img) return; }
      else img = await fileToDataURL(f, 1080, 0.7); await save("photos", "p" + uid(), { menuId, img, createdAt: Date.now() }); n++; }
    catch(e){ toast("有一张没传上：" + (e.message || e.code)); }
  }
  if (n) toast(`传好了 ${n} 张`);
  const sh = $("#sheetRoot .sheet");
  if (sh && sh.querySelector(".photos")) sh.querySelector(".photos").outerHTML = photoGrid(menuById(menuId));
}
function bump(){ const b = $("#bowl"); if (b) { b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); } }

const inflight = new Set();
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  // 会写数据库的操作：同一个还没存完时，再点直接忽略
  if (["submit","toggleOpen","customToLib","logout","toggleSlot","bookStatus","cancelBooking"].includes(act)) {
    const key = act + ":" + (el.dataset.id || el.dataset.name || el.dataset.date || "");
    if (inflight.has(key)) return;
    inflight.add(key); el.disabled = true;
    try { await handleAct(act, el, e); } finally { inflight.delete(key); el.disabled = false; }
    return;
  }
  await handleAct(act, el, e);
});
async function handleAct(act, el, e){
  if (act === "closeSheet") {
    if (el.classList.contains("scrim")) {
      if (e.target !== el) return;
      if (el.hasAttribute("data-form")) { if (document.activeElement && el.contains(document.activeElement)) document.activeElement.blur(); return; }
    }
    closeSheet(); return;
  }
  if (act === "role") { S.role = el.dataset.v; window.scrollTo(0,0); render(); }
  else if (act === "friendTab") { S.friendTab = el.dataset.v; window.scrollTo(0,0); render(); }
  else if (act === "jump") { e.preventDefault(); const t = document.getElementById("cat-" + el.dataset.i); if (t) t.scrollIntoView({ behavior: "smooth" }); }
  else if (act === "inc") { S.cart[el.dataset.id] = (S.cart[el.dataset.id] || 0) + 1; render(); bump(); }
  else if (act === "dec") { const k = el.dataset.id; S.cart[k] = Math.max(0, (S.cart[k] || 0) - 1); if (!S.cart[k]) delete S.cart[k]; render(); }
  else if (act === "addCustom") {
    const name = S.cName.trim(), taste = S.cTaste.trim();
    if (!name) { toast("写个菜名"); return; }
    S.customs.push({ name, taste }); S.cName = S.cTaste = ""; render(); bump(); toast("已加入，选好了点下面提交");
  }
  else if (act === "rmCustom") { S.customs.splice(+el.dataset.i, 1); render(); }
  else if (act === "submit") await submitOrder();
  else if (act === "login") loginSheet();
  else if (act === "logout") { await Cloud.sb.auth.signOut(); setOwner(false); render(); toast("已退出"); }
  else if (act === "hostTab") { S.hostTab = el.dataset.v; render(); }
  else if (act === "pickMenu") { S.hostMenuId = el.dataset.id; render(); }
  else if (act === "newMenu") menuSheet();
  else if (act === "editMenu") menuSheet(el.dataset.id);
  else if (act === "toggleOpen") { const m = menuById(el.dataset.id), rec = { ...m, status: m.status === "open" ? "closed" : "open" }; delete rec.id; await save("menus", m.id, rec); }
  else if (act === "finalize") finalizeSheet(el.dataset.id);
  else if (act === "addPast") pastSheet();
  else if (act === "book") bookSheet(el.dataset.date);
  else if (act === "cancelBooking") {
    const b = S.bookings.find(x => x.id === el.dataset.id); if (!b) return;
    if (el.dataset.armed !== "1") { el.dataset.armed = "1"; el.textContent = "再点一次确认取消"; return; }
    const rec = { ...b, status: "cancelled" }; delete rec.id; await save("bookings", b.id, rec); toast("已取消");
  }
  else if (act === "toggleSlot") { const date = el.dataset.date; await save("slots", slotId(date), { date, open: !slotOpen(date) }); }
  else if (act === "bookStatus") {
    const b = S.bookings.find(x => x.id === el.dataset.id); if (!b) return;
    const rec = { ...b, status: el.dataset.v }; delete rec.id; await save("bookings", b.id, rec);
    toast(el.dataset.v === "confirmed" ? `已确认 ${b.name}，可以“用这天开一期”了` : "已婉拒");
  }
  else if (act === "menuFromBooking") { const b = S.bookings.find(x => x.id === el.dataset.id); if (b) menuSheet(null, { date: b.date, guests: [b.name], _bookingId: b.id }); }
  else if (act === "editDish") dishSheet(el.dataset.id);
  else if (act === "viewPhoto") photoSheet(el.dataset.id);
  else if (act === "allPhotos") allPhotosSheet(el.dataset.id);
  else if (act === "customToLib") {
    const nid = "d" + uid();
    await save("dishes", nid, { name: el.dataset.name, cat: "热菜", desc: el.dataset.taste, active: true, img: "", createdAt: Date.now() });
    if (S.mode === "cloud") makePhoto(nid);
    toast(`“${el.dataset.name}”已收进菜单库，可以去补张照片`);
  }
  else if (act === "copyLink") {
    const m = menuById(el.dataset.id);
    copy(`甜水园食堂 ${fmtDate(m.date)}${m.time ? " " + m.time : ""} 开饭，来点菜：${shareURL(m)}`);
  }
}
document.addEventListener("input", e => {
  if (e.target.id === "fname") S.friendName = e.target.value;
  else if (e.target.id === "cname") S.cName = e.target.value;
  else if (e.target.id === "ctaste") S.cTaste = e.target.value;
});
document.addEventListener("change", e => { if (e.target.classList.contains("photoInput") && e.target.files.length) { const fs = [...e.target.files]; e.target.value = ""; uploadPhotos(e.target.dataset.menu, fs); } });
window.addEventListener("hashchange", () => { S.role = "friend"; S.friendTab = tabFromHash(); window.scrollTo(0,0); render(); });
boot();
</script>
